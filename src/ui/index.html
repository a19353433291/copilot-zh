<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Copilot 汉化助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-left">
      <div class="logo">中</div>
      <div class="header-title">
        <span class="title">Copilot 汉化助手</span>
        <span class="version" id="badge-version">—</span>
      </div>
    </div>
    <div class="header-right">
      <span class="pill" id="badge-watcher">—</span>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.42.5.75.94.91H21a2 2 0 0 1 0 4h-.09c-.44.16-.8.49-.94.91z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main" id="main-scroll">

    <!-- 状态卡片 -->
    <section class="status-card" id="status-card">
      <div class="status-row">
        <span class="status-dot" id="watch-dot"></span>
        <div class="status-text-wrap">
          <div class="status-title" id="watch-text">正在初始化常驻监控…</div>
          <div class="status-sub" id="watch-sub"></div>
        </div>
      </div>
      <div class="status-actions">
        <button class="btn btn-sm" id="btn-inject-now" hidden>立即汉化</button>
        <button class="btn btn-sm" id="btn-launch-copilot" hidden>启动 Copilot</button>
      </div>
    </section>

    <!-- 配置区 -->
    <section class="section">
      <h2 class="section-title">配置</h2>
      <div class="list">

        <div class="list-row">
          <div class="row-main">
            <div class="row-name">目标应用</div>
            <div class="row-value" id="target-info">正在检测…</div>
          </div>
          <div class="row-actions">
            <button class="link-btn" id="btn-locate">重新检测</button>
            <button class="link-btn" id="btn-choose">手动选择</button>
          </div>
        </div>

        <div class="list-row">
          <div class="row-main">
            <div class="row-name">字典包</div>
            <div class="row-value" id="pack-info">尚未安装</div>
          </div>
          <div class="row-actions">
            <button class="link-btn" id="btn-import-pack">导入</button>
            <button class="link-btn" id="btn-open-packs">目录</button>
            <button class="link-btn" id="btn-check-update">检查更新</button>
          </div>
        </div>

      </div>
    </section>

    <!-- 模式选择 -->
    <section class="section">
      <h2 class="section-title">汉化模式</h2>
      <div class="engine-list" id="engine-list"></div>
      <p class="footnote" id="engine-hint"></p>
    </section>

    <!-- 主操作 -->
    <section class="section action-section">
      <div class="primary-actions">
        <button class="btn btn-primary btn-lg" id="btn-apply" disabled>执行汉化</button>
        <button class="btn btn-lg" id="btn-revert">还原英文</button>
      </div>
      <div class="progress" id="progress-wrap" hidden>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">准备中…</div>
      </div>
      <div class="alert" id="result" hidden></div>
    </section>

    <!-- 残留清理（可折叠） -->
    <details class="section details">
      <summary>
        <span class="section-title">残留检查与清理</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </summary>
      <div class="details-body">
        <div class="row-value audit-box" id="audit-info">尚未检查</div>
        <div class="details-actions">
          <button class="btn btn-sm" id="btn-audit">重新检查</button>
          <button class="btn btn-sm btn-danger-ghost" id="btn-cleanall">彻底清理</button>
          <button class="link-btn" id="btn-open-data">打开数据目录</button>
        </div>
      </div>
    </details>

  </main>

  <footer class="footer">
    <span id="status-text">就绪</span>
    <span class="footer-right" id="status-dir" title=""></span>
  </footer>

</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-head">
      <h2>设置</h2>
      <button class="icon-btn" id="btn-settings-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">

      <div class="setting-group">
        <div class="setting-group-title">汉化行为</div>

        <label class="setting-row">
          <div class="setting-text">
            <div class="setting-name">汉化后同步启动 GitHub Copilot</div>
            <div class="setting-desc">执行汉化成功后，若 Copilot 未运行则自动启动</div>
          </div>
          <span class="switch"><input type="checkbox" id="set-launch-after-apply"><span class="track"></span></span>
        </label>

        <label class="setting-row">
          <div class="setting-text">
            <div class="setting-name">常驻监控自动汉化</div>
            <div class="setting-desc">Copilot 启动或页面刷新时自动注入中文</div>
          </div>
          <span class="switch"><input type="checkbox" id="set-auto-inject"><span class="track"></span></span>
        </label>

        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-name">检查间隔</div>
            <div class="setting-desc">越小越灵敏，CPU 开销略高</div>
          </div>
          <select id="set-interval" class="select">
            <option value="800">800 毫秒</option>
            <option value="1500">1.5 秒（推荐）</option>
            <option value="3000">3 秒</option>
            <option value="5000">5 秒</option>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">系统集成</div>

        <label class="setting-row">
          <div class="setting-text">
            <div class="setting-name">开机自动启动</div>
            <div class="setting-desc" id="autostart-hint">随 Windows 启动并静默运行</div>
          </div>
          <span class="switch"><input type="checkbox" id="set-run-at-login"><span class="track"></span></span>
        </label>

        <label class="setting-row">
          <div class="setting-text">
            <div class="setting-name">关闭窗口时最小化到托盘</div>
            <div class="setting-desc">关闭后常驻监控会停止，建议保持开启</div>
          </div>
          <span class="switch"><input type="checkbox" id="set-minimize-tray"><span class="track"></span></span>
        </label>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">数据</div>

        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-name">数据目录</div>
            <div class="setting-desc mono-sm" id="settings-datadir"></div>
          </div>
          <button class="link-btn" id="btn-open-data-2">打开</button>
        </div>

        <div class="setting-row">
          <div class="setting-text">
            <div class="setting-name">恢复默认设置</div>
            <div class="setting-desc">重置所有选项为初始值</div>
          </div>
          <button class="link-btn" id="btn-reset-settings">恢复默认</button>
        </div>
      </div>

    </div>

    <div class="modal-foot">
      <span class="saved-hint" id="settings-saved-hint"></span>
      <button class="btn btn-primary btn-sm" id="btn-settings-done">完成</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
