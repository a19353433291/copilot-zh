<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Copilot 汉化助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="titlebar">
    <div class="brand">
      <span class="logo">中</span>
      <div class="brand-text">
        <strong>Copilot 汉化助手</strong>
        <span class="sub">GitHub Copilot 桌面版汉化工具</span>
      </div>
    </div>
    <div class="env-badges">
      <span class="badge" id="badge-version">版本 —</span>
      <span class="badge" id="badge-watcher">监控 —</span>
      <button class="btn ghost small" id="btn-settings" title="设置">⚙ 设置</button>
    </div>
  </header>

  <!-- 常驻监控状态条 -->
  <div class="watchbar" id="watchbar">
    <span class="dot" id="watch-dot"></span>
    <span id="watch-text">正在初始化常驻监控…</span>
    <button class="btn ghost small" id="btn-inject-now" hidden>立即汉化当前 Copilot</button>
    <button class="btn ghost small" id="btn-launch-copilot" hidden>启动 Copilot</button>
  </div>

  <main class="content">

    <!-- 步骤 1：目标应用 -->
    <section class="card">
      <div class="card-head">
        <h2><span class="step-no">1</span> 目标应用</h2>
        <button class="btn ghost" id="btn-locate">重新检测</button>
      </div>
      <div id="target-info" class="target-empty">正在检测 GitHub Copilot…</div>
      <div class="row-actions">
        <button class="btn ghost small" id="btn-choose">手动选择路径</button>
      </div>
    </section>

    <!-- 步骤 2：选择模式 -->
    <section class="card">
      <div class="card-head">
        <h2><span class="step-no">2</span> 选择汉化模式</h2>
      </div>
      <div id="engine-list" class="engine-list"></div>
      <p class="hint" id="engine-hint">选择一种模式后，可先探测兼容性再执行。</p>
    </section>

    <!-- 步骤 3：字典包 -->
    <section class="card">
      <div class="card-head">
        <h2><span class="step-no">3</span> 字典包</h2>
        <div class="head-actions">
          <button class="btn ghost small" id="btn-open-packs">打开目录</button>
          <button class="btn ghost small" id="btn-check-update">检查更新</button>
        </div>
      </div>
      <div id="pack-info" class="pack-empty">尚未安装字典包</div>
      <div class="row-actions">
        <button class="btn ghost small" id="btn-import-pack">导入字典包…</button>
      </div>
    </section>

    <!-- 执行区 -->
    <section class="card action-card">
      <div class="run-row">
        <button class="btn primary" id="btn-apply" disabled>执行汉化</button>
        <button class="btn danger" id="btn-revert">还原英文</button>
      </div>
      <div class="progress-wrap" id="progress-wrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">准备中…</div>
      </div>
      <div id="result" class="result" hidden></div>
    </section>

    <!-- 残留审计与彻底清理 -->
    <section class="card danger-card">
      <div class="card-head">
        <h2><span class="step-no">!</span> 残留检查与彻底清理</h2>
        <button class="btn ghost small" id="btn-audit">重新检查</button>
      </div>
      <p class="hint" style="margin-top:0">
        本工具可能会在系统中留下调试端口策略、用户数据等痕迹。点击下方按钮可查看当前残留并一键清除。
      </p>
      <div id="audit-info" class="audit-empty">尚未检查</div>
      <div class="row-actions">
        <button class="btn danger" id="btn-cleanall">彻底清理所有残留</button>
        <button class="btn ghost small" id="btn-open-data">打开数据目录</button>
      </div>
    </section>

  </main>

  <footer class="statusbar">
    <span id="status-text">就绪</span>
    <span class="right" id="status-dir"></span>
  </footer>

</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settings-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>设置</h2>
      <button class="modal-close" id="btn-settings-close">✕</button>
    </div>
    <div class="modal-body">

      <div class="setting-group">
        <div class="setting-group-title">汉化行为</div>

        <label class="setting-item">
          <input type="checkbox" id="set-launch-after-apply">
          <div class="setting-text">
            <div class="setting-name">汉化后同步启动 GitHub Copilot</div>
            <div class="setting-desc">执行汉化成功后，如果 Copilot 未运行则自动启动它</div>
          </div>
        </label>

        <label class="setting-item">
          <input type="checkbox" id="set-auto-inject">
          <div class="setting-text">
            <div class="setting-name">常驻监控：Copilot 启动时自动汉化</div>
            <div class="setting-desc">后台持续监测，Copilot 一启动就自动注入中文，页面刷新后自动重新注入</div>
          </div>
        </label>

        <div class="setting-item">
          <div class="setting-text">
            <div class="setting-name">监控检查间隔</div>
            <div class="setting-desc">数值越小越灵敏，但 CPU 开销略高（建议 1000–3000 毫秒）</div>
          </div>
          <select id="set-interval" class="setting-select">
            <option value="800">800 毫秒</option>
            <option value="1500">1500 毫秒（推荐）</option>
            <option value="3000">3000 毫秒</option>
            <option value="5000">5000 毫秒</option>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">系统集成</div>

        <label class="setting-item">
          <input type="checkbox" id="set-run-at-login">
          <div class="setting-text">
            <div class="setting-name">开机自动启动汉化助手</div>
            <div class="setting-desc" id="autostart-hint">随 Windows 启动，并在后台静默运行</div>
          </div>
        </label>

        <label class="setting-item">
          <input type="checkbox" id="set-minimize-tray">
          <div class="setting-text">
            <div class="setting-name">关闭窗口时最小化到托盘</div>
            <div class="setting-desc">关闭后常驻监控会停止；建议保持开启</div>
          </div>
        </label>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">数据</div>
        <div class="setting-item">
          <div class="setting-text">
            <div class="setting-name">数据目录</div>
            <div class="setting-desc path" id="settings-datadir"></div>
          </div>
          <button class="btn ghost small" id="btn-open-data-2">打开</button>
        </div>
        <div class="setting-item">
          <div class="setting-text">
            <div class="setting-name">恢复默认设置</div>
            <div class="setting-desc">将所有设置恢复为初始值</div>
          </div>
          <button class="btn ghost small" id="btn-reset-settings">恢复默认</button>
        </div>
      </div>

    </div>
    <div class="modal-foot">
      <span class="modal-hint" id="settings-saved-hint"></span>
      <button class="btn primary small" id="btn-settings-done">完成</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
